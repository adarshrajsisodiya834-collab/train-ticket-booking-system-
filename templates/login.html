{% extends "base.html" %}
{% block title %}
Login - TTBS
{% endblock %}
{% block content %}
    <div class="auth-card">
        <h1>
            Login
        </h1>
        <form method="post">
            <label>
                Email<input type="email" name="email" required>
            </label>
            <label>
                Password<input type="password" name="password" required>
            </label>
            <button>
                Login
            </button>
        </form>
        <p>
            New here? <a href="/register">Create an account</a>
        </p>
    </div>
{% endblock %}
