{% extends "base.html" %}
{% block title %}
Add Train - TTBS
{% endblock %}
{% block content %}
    <div class="form-card">
        <div class="card-header">
            <div>
                <p class="eyebrow">
                    TRAIN MANAGEMENT
                </p>
                <h1>
                    Add Train
                </h1>
            </div>
            <a href="/admin/dashboard" class="button secondary">Back</a>
        </div>
        <form method="post" class="form-grid">
            <label>
                Train Number<input name="train_number" required>
            </label>
            <label>
                Train Name<input name="train_name" required>
            </label>
            <label>
                Source<input name="source" required>
            </label>
            <label>
                Destination<input name="destination" required>
            </label>
            <label>
                Departure<input type="time" name="departure" required>
            </label>
            <label>
                Arrival<input type="time" name="arrival" required>
            </label>
            <label>
                Duration<input name="duration" placeholder="6h 45m" required>
            </label>
            <label>
                Sleeper Seats<input type="number" name="sleeper_seats" min="0" required>
            </label>
            <label>
                3A Seats<input type="number" name="ac3_seats" min="0" required>
            </label>
            <label>
                2A Seats<input type="number" name="ac2_seats" min="0" required>
            </label>
            <label>
                1A Seats<input type="number" name="ac1_seats" min="0" required>
            </label>
            <button>
                Add Train
            </button>
        </form>
    </div>
{% endblock %}
